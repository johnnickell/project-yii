name: Build

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the running environment
        run: ./bin/up
      - name: Install the locked development dependencies
        run: ./bin/composer install --no-interaction --prefer-dist --no-progress
      - name: Verify
        run: ./bin/build
      - name: Stop the environment
        if: always()
        run: ./bin/down
