services:
  app:
    build:
      context: .
      dockerfile: etc/docker/fpm/Dockerfile
      args:
        APP_UID: "${FIGHT_UID:-1000}"
        APP_GID: "${FIGHT_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app

  web:
    build:
      context: .
      dockerfile: etc/docker/nginx/Dockerfile
    depends_on:
      - app
    ports:
      - "${PROJECT_YII_HTTP_PORT:-8088}:80"
    volumes:
      - .:/app:ro
