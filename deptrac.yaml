deptrac:
    cache_file: ./var/cache/deptrac.cache
    paths:
        - ./src
    exclude_files:
        - '#.*tests.*#'
    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: '^App\\Domain\\'
        - name: Application
          collectors:
              - type: classLike
                value: '^App\\Application\\'
        - name: Adapter
          collectors:
              - type: classLike
                value: '^App\\Adapter\\'
        - name: Vendor
          collectors:
              - type: classLike
                value: '^(?!App\\)'
    ruleset:
        Domain:
            - Vendor
        Application:
            - Domain
            - Vendor
        Adapter:
            - Application
            - Domain
            - Vendor
    skip_violations: {}
